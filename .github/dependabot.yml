version: 2
updates:
  # Grouped so each ecosystem arrives as one PR per week instead of one per package.
  - package-ecosystem: "pip"
    directory: "/uploader"
    schedule:
      interval: "weekly"
    groups:
      python-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
