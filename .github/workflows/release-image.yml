name: Publish image

# Publishes the uploader image to ghcr.io. release.yml dispatches it on the new tag when a
# release PR merges; that is the normal path. A manual run (version + publish) publishes or
# dry-runs a version by hand, and a release tag (x.y.z) pushed by hand also publishes, as a
# fallback. Pull requests that touch this workflow, the Dockerfile or the dependency lock
# only dry-run: both platforms are built and scanned, but nothing logs in or pushes.
#
# A published version tag is immutable: if ghcr.io already has it, nothing is rebuilt or
# pushed, so a retried run can never change the digest someone has already deployed.
on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]
  pull_request:
    paths:
      - ".github/workflows/release-image.yml"
      - "uploader/Dockerfile"
      - "uploader/requirements.txt"
  workflow_dispatch:
    inputs:
      version:
        description: "Existing release tag to build, e.g. 0.1.1"
        required: true
        type: string
      publish:
        description: "Push to ghcr.io (false = build and scan only)"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || inputs.version || github.ref_name }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/solarssk/drive-scanner-bridge

jobs:
  image:
    name: Build, scan, publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      PUBLISH: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
    steps:
      - name: Resolve the version to build
        id: v
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          case "$EVENT" in
            push) version="$TAG" ;;
            workflow_dispatch) version="$INPUT_VERSION" ;;
            *) version="dev" ;;
          esac
          if [ "$version" != "dev" ] && ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "not a release version: $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && steps.v.outputs.version || '' }}
          persist-credentials: false

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to ghcr.io
        if: env.PUBLISH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image name, tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: type=raw,value=${{ steps.v.outputs.version }}

      # Fails closed: only the registry's own "not found" answer counts as "not published";
      # any other error stops the run instead of risking an overwrite.
      - name: Is this version already published?
        id: published
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          set -uo pipefail
          if OUT="$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" 2>&1)"; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${IMAGE}:${VERSION} is already published; release tags are immutable, leaving it untouched."
          elif printf '%s' "$OUT" | grep -qiE 'not found|manifest unknown|no such manifest'; then
            echo "already=false" >> "$GITHUB_OUTPUT"
          elif [ "$PUBLISH" = "true" ]; then
            echo "::error::Could not tell whether ${IMAGE}:${VERSION} is already published: ${OUT}" >&2
            exit 1
          else
            # A dry run pushes nothing, so an inconclusive lookup must not fail it.
            echo "::warning::Could not tell whether ${IMAGE}:${VERSION} is already published (dry run, continuing): ${OUT}"
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi

      # Scan what will be published BEFORE pushing it, and scan EACH platform: the arm64
      # variant has its own base-image layers and its own architecture-specific wheels, so a
      # clean amd64 scan says nothing about it. Every platform is built into the local store
      # and scanned; a CRITICAL or HIGH finding with a fix stops the run before any push.
      # Each platform keeps its own cache scope, so the push step below reuses the very
      # layers that were scanned instead of rebuilding them.
      - name: Build linux/amd64 for the pre-push scan
        if: steps.published.outputs.already != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./uploader
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ env.IMAGE }}:scan-amd64
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          cache-from: type=gha,scope=release-image-amd64
          cache-to: type=gha,scope=release-image-amd64,mode=max

      - name: Scan linux/amd64 (CRITICAL and HIGH with a fix block publishing)
        if: steps.published.outputs.already != 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:scan-amd64
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Build linux/arm64 for the pre-push scan
        if: steps.published.outputs.already != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./uploader
          platforms: linux/arm64
          load: true
          push: false
          tags: ${{ env.IMAGE }}:scan-arm64
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          cache-from: type=gha,scope=release-image-arm64
          cache-to: type=gha,scope=release-image-arm64,mode=max

      - name: Scan linux/arm64 (CRITICAL and HIGH with a fix block publishing)
        if: steps.published.outputs.already != 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:scan-arm64
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      # provenance is off so the manifest list holds exactly the two platform images
      # (no extra attestation entries that older Docker/registry UIs show as "unknown").
      - name: Build both platforms and push
        id: push
        if: steps.published.outputs.already != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./uploader
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          cache-from: |
            type=gha,scope=release-image-amd64
            type=gha,scope=release-image-arm64

      - name: Summary
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.push.outputs.digest }}
          ALREADY: ${{ steps.published.outputs.already }}
        run: |
          if [ "$ALREADY" = "true" ]; then
            echo "Already published, nothing rebuilt or pushed: \`$TAGS\`" >> "$GITHUB_STEP_SUMMARY"
          elif [ "$PUBLISH" = "true" ]; then
            echo "Published \`$TAGS\` (digest \`$DIGEST\`)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Dry run: \`$TAGS\` built for linux/amd64 and linux/arm64 and scanned, nothing pushed" >> "$GITHUB_STEP_SUMMARY"
          fi
