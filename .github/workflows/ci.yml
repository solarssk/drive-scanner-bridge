name: CI

on:
  # Push runs only on main; every other branch is built by its pull_request run.
  # Running both for the same commit just doubled every check.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: uploader
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: 'pip install --require-hashes --only-binary=:all: -r requirements.txt'
      - run: pip install -e ".[dev]"
      - run: 'pip install --upgrade --only-binary=:all: "pip==26.2.1" "setuptools==84.0.0"'
      - run: 'pip install --only-binary=:all: "pip-audit==2.10.1" && pip-audit'
      - run: ruff check . ../scripts
      - run: mypy
      - run: pytest -q --cov=scanner_drive_bridge --cov-report=xml:coverage.xml --cov-report=term --junitxml=junit.xml
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: coverage-report
          path: |
            uploader/coverage.xml
            uploader/junit.xml
          retention-days: 7
      # Reproduces what the Dockerfile does (hash-locked deps, then the package with
      # --no-deps) in a throwaway venv. The editable install above resolves anything
      # missing from requirements.txt by itself, so without this a dependency added to
      # pyproject.toml but not to requirements.in would pass the tests and then be
      # absent from the production image. `pip check` fails on exactly that.
      - name: Check requirements.txt covers the package's dependencies, as the Docker build installs them
        run: |
          python -m venv "$RUNNER_TEMP/lockcheck"
          "$RUNNER_TEMP/lockcheck/bin/pip" install --require-hashes --only-binary=:all: -r requirements.txt
          "$RUNNER_TEMP/lockcheck/bin/pip" install --no-deps .
          "$RUNNER_TEMP/lockcheck/bin/pip" check

  code-quality:
    name: Code quality (Sonar + Codecov)
    runs-on: ubuntu-latest
    needs: test
    # Run even when Unit tests failed -- that's exactly when test-result
    # analytics (which test failed, flaky-test detection) matters most.
    # This never masks a test failure: "Unit tests" is its own separate
    # required status check.
    if: ${{ !cancelled() }}
    env:
      # `secrets` is not a permitted context inside `if:` conditions (job-
      # or step-level) -- route the presence check through `env` instead,
      # which is. Dependabot-triggered runs (and any external fork PR)
      # don't receive repository Actions secrets, so the steps below skip.
      HAS_SONAR_TOKEN: ${{ secrets.SONAR_TOKEN != '' }}
      HAS_CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-report
          path: uploader
      # Sonar and Codecov are report-only signals, not merge gates (same as the
      # owner's other repositories): no check from this job or from the Sonar/
      # Codecov apps is required. Each secret-backed step skips cleanly when its
      # token is absent, and continue-on-error keeps an outage of either service
      # from turning this job red.
      - name: SonarQube Cloud Scan
        if: ${{ !cancelled() && env.HAS_SONAR_TOKEN == 'true' }}
        continue-on-error: true
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      - name: Upload coverage to Codecov
        if: ${{ !cancelled() && env.HAS_CODECOV_TOKEN == 'true' }}
        continue-on-error: true
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: uploader/coverage.xml
          fail_ci_if_error: false
      - name: Upload test results to Codecov
        if: ${{ !cancelled() && env.HAS_CODECOV_TOKEN == 'true' }}
        continue-on-error: true
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: uploader/junit.xml
          report_type: test_results
          fail_ci_if_error: false

  build-image:
    name: Build uploader image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./uploader
          push: false
          load: true
          tags: scanner-drive-bridge-uploader:ci
      - name: Scan image for Critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: scanner-drive-bridge-uploader:ci
          format: table
          # Only CRITICAL blocks a merge here -- HIGH findings in the base
          # image drift with Google's distroless rebuild cadence, not with
          # this repo's own code, and would otherwise turn every PR red for
          # days at a time with nothing mergeable to fix it. The full
          # picture (CRITICAL+HIGH) still runs weekly, unblocked, in
          # weekly-image-scan.yml -- see that workflow and docs/maintenance.md
          # (Container scanning).
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  # Correctness (actionlint, with shellcheck on every run: block) and safety (zizmor: template
  # injection, excessive permissions, unpinned actions, Dependabot without a cooldown). Neither
  # covers the other. Both tools are pinned, and actionlint is verified against the checksum
  # of its own release before it runs.
  lint-workflows:
    name: Lint workflows (actionlint, zizmor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install actionlint (checksum-verified)
        env:
          ACTIONLINT_VERSION: "1.7.12"
          # From the release's own actionlint_<version>_checksums.txt. Update it with the version.
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl --proto '=https' --tlsv1.2 -sSfL -o "$archive" "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" actionlint
          echo "$PWD" >> "$GITHUB_PATH"
      - name: actionlint
        # No arguments: actionlint finds every workflow, with both the .yml and .yaml extension.
        run: actionlint
      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          version: v1.30.1
          advanced-security: false
          annotations: true

  # Scoped to the commits this run introduces. gitleaks' default (`git log --all`) scans every
  # branch's whole history on every run and fails a PR over an old commit it did not touch.
  # Complements GitHub's own secret scanning and push protection; neither replaces the other.
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks (checksum-verified)
        env:
          GITLEAKS_VERSION: "8.30.1"
          # From the release's own gitleaks_<version>_checksums.txt. Update it with the version.
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --proto '=https' --tlsv1.2 -sSfL -o "$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" gitleaks
          echo "$PWD" >> "$GITHUB_PATH"
      - name: Compute scan range
        id: range
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            echo "range=origin/${BASE_REF}..HEAD" >> "$GITHUB_OUTPUT"
          elif [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            echo "range=${BEFORE_SHA}..${HEAD_SHA}" >> "$GITHUB_OUTPUT"
          else
            echo "range=-1" >> "$GITHUB_OUTPUT"
          fi
      - name: gitleaks (scoped to this run's commits)
        env:
          SCAN_RANGE: ${{ steps.range.outputs.range }}
        run: gitleaks detect --source . --log-opts="$SCAN_RANGE" --exit-code 1

  compose-lint:
    name: Validate docker-compose.yml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Render compose config with placeholder values
        run: |
          cat > .env <<'EOF'
          SMB_PRT01_PASSWORD=ci-placeholder
          SMB1_STATIC_IP=192.0.2.20
          SYNOLOGY_HOST=https://192.0.2.10:5001
          EOF
          docker compose config > /dev/null
