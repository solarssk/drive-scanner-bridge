name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: uploader
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: 'pip install --upgrade --only-binary=:all: "pip==26.2.1" "setuptools==84.0.0"'
      - run: 'pip install --only-binary=:all: "pip-audit==2.10.1" && pip-audit'
      - run: pytest -q

  build-image:
    name: Build uploader image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ./uploader
          push: false
          load: true
          tags: scanner-drive-bridge-uploader:ci
      - name: Scan image for Critical/High vulnerabilities
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: scanner-drive-bridge-uploader:ci
          format: table
          severity: CRITICAL,HIGH
          exit-code: "1"

  compose-lint:
    name: Validate docker-compose.yml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Render compose config with placeholder values
        run: |
          cat > .env <<'EOF'
          SMB_PRT01_PASSWORD=ci-placeholder
          SMB1_STATIC_IP=192.0.2.20
          SYNOLOGY_HOST=https://192.0.2.10:5001
          EOF
          docker compose config > /dev/null
