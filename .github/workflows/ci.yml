name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: uploader
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: pytest -q

  build-image:
    name: Build uploader image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ./uploader
          push: false
          tags: scanner-drive-bridge-uploader:ci

  compose-lint:
    name: Validate docker-compose.yml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render compose config with placeholder values
        run: |
          cat > .env <<'EOF'
          SMB_PRT01_PASSWORD=ci-placeholder
          SMB1_STATIC_IP=192.0.2.20
          SYNOLOGY_HOST=https://192.0.2.10:5001
          EOF
          docker compose config > /dev/null
