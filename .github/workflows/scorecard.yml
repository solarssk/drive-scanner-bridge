name: OpenSSF Scorecard

# Report-only and kept off the pull request path: it scores the repository's own
# supply-chain posture (pinned actions, permissions, SAST, branch protection, ...) and
# publishes the result for the badge. See the playbook's docs/openssf.md. It is never a
# merge gate.
on:
  branch_protection_rule:
  schedule:
    - cron: "0 4 * * 3"
  push:
    branches: [main]

permissions: {}

# One group per event, and never cancel. A push and a branch-protection change on the same ref
# used to share a group, so the later one cancelled the earlier and left a cancelled run next
# to the release commit. Scorecard only reports, so letting both finish costs nothing.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # Scorecard reads workflow files for its own checks
      id-token: write # sign and publish results to the public Scorecard API
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
