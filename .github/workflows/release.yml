name: Release

# Merging a release PR to main (version bumped in uploader/pyproject.toml, matching
# `## [X.Y.Z] - YYYY-MM-DD` entry in CHANGELOG.md) is the whole release procedure:
# this workflow creates the git tag and the GitHub Release (notes built from the
# CHANGELOG), starts release-image.yml to publish the image, and closes the milestone
# named after the version. Same shape as the owner's other repos, adapted to this
# repo's conventions (tags have no "v" prefix; the version lives in uploader/pyproject.toml).
#
# It detects a release by comparing the version before and after this push, and checks
# the real artifacts (CHANGELOG heading, __version__, the compose image tag) instead of
# trusting a commit message. A mismatch fails the run loudly and releases nothing.
#
# `gh release create` tags with GITHUB_TOKEN, and tag pushes made with GITHUB_TOKEN do not
# start other workflows, so release-image.yml is dispatched explicitly below.
#
# Run it by hand (workflow_dispatch) to recover: it re-runs the steps for the version
# currently in pyproject.toml, and every step is safe to repeat.
on:
  push:
    branches: [main]
  workflow_dispatch:

# One group per commit, not per repository: a group keeps one running and one pending
# run, and every push to main shares this workflow, so a shared group could evict the
# pending run of a real release push.
concurrency:
  group: release-${{ github.sha }}
  cancel-in-progress: false

permissions: {}

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: write # tag + release
      actions: write # dispatch release-image.yml
      issues: write # the Milestones API lives under Issues, not Contents
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect a release
        id: bump
        env:
          EVENT_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          NEW="$(python3 -c 'import tomllib; print(tomllib.load(open("uploader/pyproject.toml", "rb"))["project"]["version"])')"
          if ! printf '%s' "$NEW" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::uploader/pyproject.toml version is not X.Y.Z: $NEW" >&2
            exit 1
          fi

          BEFORE="${EVENT_BEFORE:-}"
          HAVE_BEFORE=false
          if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            HAVE_BEFORE=true
          fi

          OLD=""
          if [ "$HAVE_BEFORE" = "true" ] && git cat-file -e "${BEFORE}:uploader/pyproject.toml" 2>/dev/null; then
            OLD="$(git show "${BEFORE}:uploader/pyproject.toml" \
              | python3 -c 'import sys, tomllib; print(tomllib.load(sys.stdin.buffer)["project"]["version"])' 2>/dev/null || true)"
          fi

          HEADING_RE="^## \[${NEW//./\\.}\] - [0-9]{4}-[0-9]{2}-[0-9]{2}"
          CHANGELOG_OK=false
          grep -qE "$HEADING_RE" CHANGELOG.md && CHANGELOG_OK=true
          CHANGELOG_OK_BEFORE=false
          if [ "$HAVE_BEFORE" = "true" ] && git cat-file -e "${BEFORE}:CHANGELOG.md" 2>/dev/null; then
            git show "${BEFORE}:CHANGELOG.md" | grep -qE "$HEADING_RE" && CHANGELOG_OK_BEFORE=true
          fi

          # Attempt when this push moved the version, or when the version is unchanged but
          # this very push is the one that added the missing CHANGELOG heading (the recovery
          # for an earlier bump without one). Not "heading exists now": every later push would
          # then race the real one to create the release.
          ATTEMPT=false
          if [ "$NEW" != "$OLD" ]; then
            ATTEMPT=true
          elif [ "$CHANGELOG_OK" = "true" ] && [ "$CHANGELOG_OK_BEFORE" = "false" ]; then
            ATTEMPT=true
          fi
          if [ "$ATTEMPT" = "false" ]; then
            echo "Nothing to release for ${NEW} yet, skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$CHANGELOG_OK" = "false" ]; then
            echo "::warning::uploader/pyproject.toml is at ${NEW} but CHANGELOG.md has no '## [${NEW}] - YYYY-MM-DD' heading yet, skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # The version must agree everywhere it is written down, or the image and the
          # release would disagree about what they contain.
          FAIL=false
          if ! grep -qE "^__version__ = \"${NEW//./\\.}\"$" uploader/scanner_drive_bridge/__init__.py; then
            echo "::error::uploader/scanner_drive_bridge/__init__.py __version__ is not ${NEW}" >&2
            FAIL=true
          fi
          if ! grep -qE "image: ghcr\.io/solarssk/drive-scanner-bridge:${NEW//./\\.}$" docker-compose.yml; then
            echo "::error::docker-compose.yml image tag is not ${NEW}" >&2
            FAIL=true
          fi
          if [ "$FAIL" = "true" ]; then
            exit 1
          fi

          {
            echo "skip=false"
            echo "version=$NEW"
          } >> "$GITHUB_OUTPUT"
          echo "Release detected: ${NEW}"

      - name: Build the release notes
        if: steps.bump.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: python3 scripts/format_release_notes.py "$VERSION" > "$RUNNER_TEMP/release-notes.md"

      # --target pins a new tag to the commit this run checked out and verified, not to the
      # tip of main, which may have moved. It is only honored when gh creates the tag itself:
      # if a tag with this name already exists, gh attaches the release to it wherever it
      # points. So the tag is resolved first, and a tag on a different commit (a reused or
      # rolled-back version, or an orphan from a manual push) fails the run. The lookup fails
      # closed: only GitHub's exact "No commit found" answer counts as "tag does not exist".
      - name: Create the tag and GitHub Release
        if: steps.bump.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          set -euo pipefail
          RESPONSE="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${VERSION}" 2>/dev/null || true)"
          EXISTING_SHA="$(printf '%s' "$RESPONSE" | jq -r '.sha // empty' 2>/dev/null || true)"
          if [ -n "$EXISTING_SHA" ]; then
            if [ "$EXISTING_SHA" != "$GITHUB_SHA" ]; then
              echo "::error::Tag ${VERSION} already exists on a different commit (${EXISTING_SHA}, not ${GITHUB_SHA}); refusing to release under it." >&2
              exit 1
            fi
          else
            STATUS="$(printf '%s' "$RESPONSE" | jq -r '.status // empty' 2>/dev/null || true)"
            MESSAGE="$(printf '%s' "$RESPONSE" | jq -r '.message // empty' 2>/dev/null || true)"
            if [ "$STATUS" != "422" ] || [[ "$MESSAGE" != "No commit found for SHA:"* ]]; then
              echo "::error::Could not confirm whether tag ${VERSION} exists (got: ${RESPONSE:-<empty>}); refusing to continue." >&2
              exit 1
            fi
          fi
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release ${VERSION} already exists on this commit, skipping creation."
            exit 0
          fi
          gh release create "$VERSION" --target "$GITHUB_SHA" --title "$VERSION" --notes-file "$RUNNER_TEMP/release-notes.md"
          echo "Created release ${VERSION}."

      # `gh workflow run` only starts the run and returns; it does not wait for it. This step waits
      # for exactly the run it started and fails unless that run succeeded, so a failed build,
      # scan or push cannot end in a green release run and a closed milestone. The run is
      # identified by the URL gh returns for the created run; if this gh does not print one, by
      # a request id that is unique to this attempt and is part of the run's title. Never by
      # "the newest matching run": a manual dry run on the same tag could be mistaken for it.
      # Always runs, also on a rerun after a partial failure; release-image.yml refuses to
      # overwrite a tag that is already published, so repeating it is harmless.
      - name: Publish the container image and wait for it
        if: steps.bump.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          set -euo pipefail
          REQUEST_ID="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          OUT="$(gh workflow run release-image.yml --ref "$VERSION" -f version="$VERSION" -f publish=true -f request_id="$REQUEST_ID")"
          RUN_ID="$(printf '%s' "$OUT" | grep -oE 'actions/runs/[0-9]+' | head -n 1 | cut -d/ -f3 || true)"
          if [ -z "$RUN_ID" ]; then
            echo "gh did not return the run URL; finding the run by its request id ${REQUEST_ID}."
            for _ in $(seq 1 45); do
              RUN_ID="$(gh run list --workflow release-image.yml --event workflow_dispatch --limit 30 \
                --json databaseId,displayTitle \
                --jq ".[] | select(.displayTitle | endswith(\"[${REQUEST_ID}]\")) | .databaseId" | head -n 1)"
              [ -n "$RUN_ID" ] && break
              sleep 4
            done
          fi
          if [ -z "$RUN_ID" ]; then
            echo "::error::Dispatched release-image.yml for ${VERSION} but could not identify its run." >&2
            exit 1
          fi
          URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}"
          echo "Waiting for the image run: ${URL}"
          STATUS=""
          CONCLUSION=""
          for _ in $(seq 1 240); do
            read -r STATUS CONCLUSION < <(gh run view "$RUN_ID" --json status,conclusion --jq '"\(.status) \(.conclusion)"')
            [ "$STATUS" = "completed" ] && break
            sleep 15
          done
          if [ "$STATUS" != "completed" ] || [ "$CONCLUSION" != "success" ]; then
            echo "::error::The image run for ${VERSION} did not succeed (status=${STATUS}, conclusion=${CONCLUSION}): ${URL}. The tag and Release exist, but the image does not; fix the cause, run 'Publish image' by hand for ${VERSION}, then close the milestone." >&2
            exit 1
          fi
          echo "Image published: ${URL}"

      - name: Close the matching milestone
        if: steps.bump.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          set -euo pipefail
          MID="$(gh api "repos/${GITHUB_REPOSITORY}/milestones" \
            --jq ".[] | select(.title == \"${VERSION}\" and .state == \"open\") | .number" | head -n 1)"
          if [ -z "$MID" ]; then
            echo "No open milestone titled ${VERSION}, skipping."
            exit 0
          fi
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}/milestones/${MID}" -f state=closed
          echo "Closed milestone ${VERSION} (#${MID})."
